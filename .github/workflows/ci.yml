name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: nid:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and send an email through it
        run: |
          docker run -d --name nid -p 127.0.0.1:4400:4400 -p 127.0.0.1:1025:1025 nid:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:4400/healthz && break; sleep 1; done
          curl -fs -X POST http://127.0.0.1:4400/emails \
            -H 'authorization: Bearer re_ci' -H 'content-type: application/json' \
            -d '{"from":"ci@acme.com","to":"ci@inbox.test","subject":"CI","text":"Your code is 123456"}'
          curl -fs 'http://127.0.0.1:4400/api/wait?to=ci@inbox.test&timeout=5' | grep -q 123456
          docker rm -f nid
