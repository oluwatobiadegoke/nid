name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nid:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and send an email through it
        run: |
          docker run -d --name nid -p 127.0.0.1:4400:4400 -p 127.0.0.1:1025:1025 nid:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:4400/healthz && break; sleep 1; done
          curl -fs -X POST http://127.0.0.1:4400/emails \
            -H 'authorization: Bearer re_ci' -H 'content-type: application/json' \
            -d '{"from":"ci@acme.com","to":"ci@inbox.test","subject":"CI","text":"Your code is 123456"}'
          curl -fs 'http://127.0.0.1:4400/api/wait?to=ci@inbox.test&timeout=5' | grep -q 123456
          docker rm -f nid
