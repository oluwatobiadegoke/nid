name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Open the version PR, or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: 'Release'
          commit: 'Release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Push the tags that changeset publish created
        run: git push origin --tags

  version:
    needs: release
    if: always() && contains(fromJSON('["success", "skipped"]'), needs.release.result)
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.server.outputs.value }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the server version
        id: server
        run: echo "value=$(node -p "require('./packages/server/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image when this version is on npm and not yet on ghcr.io
        id: decide
        env:
          VERSION: ${{ steps.server.outputs.value }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/nid
        run: |
          build=false
          if npm view "nid-inbox@$VERSION" version >/dev/null 2>&1 && ! docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            build=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "nid-inbox $VERSION: build image = $build"

  image:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nid:${{ needs.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/nid:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
